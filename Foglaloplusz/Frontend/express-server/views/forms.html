<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/img/Favico.png" type="image/png" />
    <title>FoglalóPlusz — Szalon beállítása</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="theme-pink">
    <nav class="navbar navbar-expand-lg navbar-light border-bottom salonic-navbar">
        <div class="container-fluid" style="max-width:1100px;margin:0 auto;">
            <a class="navbar-brand logo p-0" href="/ownerhomepage"><img src="/img/Foglaloplusz_Logo.svg" alt="FoglalóPlusz" height="40" width="auto" /></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#makerNav" aria-controls="makerNav" aria-expanded="false" aria-label="Menü">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="makerNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 nav-links align-items-lg-center gap-lg-1">
                    <li class="nav-item"><a class="nav-link" href="/ownerhomepage">Szalonjaim</a></li>
                    <li class="nav-item"><a class="nav-link" href="/maker" aria-current="page">Új szalon felvétele</a></li>
                    <li class="nav-item"><a class="nav-link" href="/owneruserpage">Fiók</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-salonic-logout-href="/ownerlogin">Kijelentkezés</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container py-4 form-page salonic-page-enter">
        <h1 class="h3">Hozd létre a saját szalonod a FoglalóPluszban</h1>
        <p class="subtitle">Itt testreszabhatod a szalon webes megjelenését.</p>
        <form id="salon-setup-form" class="auth-form setup-form" action="#" method="post" enctype="multipart/form-data">
            <label for="salon-name" class="field-label form-label">Mi a szalon neve?</label>
            <input id="salon-name" class="form-control" name="salon_name" type="text" placeholder="…" required>
            <label for="salon-logo" class="field-label form-label">Töltsd fel a vállalkozásod logóját</label>
            <input id="salon-logo" class="form-control" name="salon_logo" type="file" accept="image/*">
            <label for="salon-description" class="field-label form-label">Írd le a szolgáltatásaidat — ez jelenik meg a kezdőlapon</label>
            <textarea id="salon-description" class="form-control" name="salon_description" rows="5" placeholder="…" required></textarea>
            <label for="salon-theme" class="field-label form-label">Válassz színt, ami illik a szalon hangulatához</label>
            <select id="salon-theme" class="form-select" name="salon_theme" required>
                <option value="theme-pink">Rózsaszín</option>
                <option value="theme-sky-blue">Égkék</option>
                <option value="theme-ruby">Rubin</option>
                <option value="theme-forest-green">Erdőzöld</option>
                <option value="theme-amethyst">Ametiszt</option>
            </select>
            <label for="salon-location" class="field-label form-label">Helyszín (cím vagy város — a vendég kezdőlapon látja)</label>
            <input id="salon-location" class="form-control" name="salon_location" type="text" placeholder="pl. Budapest, Váci utca 12." autocomplete="street-address">

            <label for="support-email" class="field-label form-label">Ügyfélszolgálati e-mail cím, ahol a vendégek elérnek</label>
            <input id="support-email" class="form-control" name="support_email" type="email" placeholder="support@gmail.com" required>
            <button type="submit" class="btn btn-primary">Szalon adatainak mentése</button>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/api.js"></script>
    <script src="/common.js"></script>
    <script src="/script.js"></script>
    <script>
        (function () {
            var themeSelect = document.getElementById("salon-theme");
            if (!themeSelect) return;
            function syncMakerTheme() {
                var t = String(themeSelect.value || "").trim();
                document.body.className = ["portal-body", "owner-app-page", t].filter(Boolean).join(" ");
            }
            themeSelect.addEventListener("change", syncMakerTheme);
            syncMakerTheme();
        })();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <script src="/buttonFeedback.js"></script>
</body>
</html>
