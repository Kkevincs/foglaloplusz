<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/img/Favico.png" type="image/png" />
    <title>FoglalóPlusz — Foglalás rögzítve</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="salon-home-page">
    <script src="/themeBoot.js"></script>
    <nav class="navbar navbar-expand-lg navbar-light border-bottom salonic-navbar">
        <div class="container-fluid">
            <a class="navbar-brand logo p-0" id="logoLink" href="#"><img src="/img/Foglaloplusz_Logo.svg" alt="FoglalóPlusz" height="40" width="auto" /></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#guestNavCollapse" aria-controls="guestNavCollapse" aria-expanded="false" aria-label="Menü">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="guestNavCollapse">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 nav-links gap-lg-2">
                    <li class="nav-item"><a class="nav-link" id="homeLink" href="#">Kezdőlap</a></li>
                    <li class="nav-item"><a class="nav-link" id="servicesLink" href="#">Szolgáltatások</a></li>
                    <li class="nav-item"><a class="nav-link" id="artistsLink" href="#">Szakemberek</a></li>
                    <li class="nav-item"><a class="nav-link" id="userLink" href="#">Profil</a></li>
                    <li class="nav-item"><a class="nav-link" id="loginLink" href="#">Bejelentkezés</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container py-4 py-lg-5 salonic-main salonic-main--wide salonic-page-enter salon-home-main">
        <section class="salon-home-hero rounded-4 p-4 p-lg-5 mb-4 text-center appointment-created-hero" aria-labelledby="appointment-created-title">
            <div class="salon-home-brand">
                <div class="appointment-created-icon mb-3" aria-hidden="true">
                    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M8 12l2.5 2.5L16 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <p class="salon-home-section-title mb-2">Foglalás megerősítve</p>
                <h1 id="appointment-created-title" class="salon-home-title mb-3">Minden a helyén</h1>
                <p class="subtitle mb-2" id="appointment-created-salon-line" hidden>
                    Itt: <strong id="appointment-created-salon-name"></strong>
                </p>
                <p class="salon-home-lead subtitle mb-4">Az időpontod elmentettük. Találkozunk a szalonban.</p>
                <div class="d-flex flex-wrap justify-content-center gap-2 appointment-created-actions">
                    <a id="appointment-created-home" class="btn btn-primary adservice-accent-btn px-4 rounded-3" href="#">Szalon kezdőlap</a>
                    <a id="appointment-created-guest" class="btn btn-primary adservice-accent-btn px-4 rounded-3" href="#">Fiókom</a>
                </div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/navbar.js"></script>
    <script src="/api.js"></script>
    <script src="/common.js"></script>
    <script src="/appointmentCreated.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <script src="/buttonFeedback.js"></script>
</body>
</html>
