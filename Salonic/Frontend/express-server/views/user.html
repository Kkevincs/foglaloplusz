<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salonic — My account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="guest-user-page salon-home-page">
    <nav class="navbar navbar-expand-lg navbar-light salonic-navbar">
        <div class="container-fluid">
            <a class="navbar-brand logo p-0" id="logoLink" href="#"><img src="/img/Salonic_Logo.png" alt="Salonic" height="40" /></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#guestNav" aria-controls="guestNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="guestNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 nav-links gap-lg-2">
                    <li class="nav-item"><a class="nav-link" id="homeLink" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" id="servicesLink" href="#">Services</a></li>
                    <li class="nav-item"><a class="nav-link" id="artistsLink" href="#">Artists</a></li>
                    <li class="nav-item"><a class="nav-link" id="userLink" href="#">User</a></li>
                    <li class="nav-item"><a class="nav-link" id="loginLink" href="#">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container py-4 py-lg-5 guest-user-main user-page salonic-main salonic-main--wide salonic-page-enter">
        <header class="artist-page-header mb-4">
            <h1 class="h3 mb-2">My account</h1>
            <p class="subtitle mb-0">Your profile and upcoming visits.</p>
        </header>
        <div id="user-profile" class="guest-user-profile-root mb-4"></div>
        <section class="guest-appts-section artist-content-panel" aria-labelledby="guest-appts-heading">
            <div class="guest-section-head">
                <h2 id="guest-appts-heading" class="guest-section-title">Upcoming appointments</h2>
                <p class="guest-section-subtitle">Visits you have scheduled</p>
            </div>
            <div id="user-appointments" class="guest-appointments-list mb-0" aria-live="polite"></div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/api.js"></script>
    <script src="/navbar.js"></script>
    <script src="/common.js"></script>
    <script src="/guestUserPage.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <script src="/buttonFeedback.js"></script>
</body>
</html>
