<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salonic — Set working hours</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <nav>
        <a id="logoLink" href="#" class="logo">Salonic</a>
        <ul class="nav-links">
            <li><a id="homeLink" href="#">Home</a></li>
            <li><a id="servicesLink" href="#">Services</a></li>
            <li><a id="userLink" href="#">User</a></li>
            <li><a id="addServiceLink" href="#">Add Service</a></li>
            <li><a id="workingHoursLink" href="#">Hours</a></li>
            <li><a id="loginLink" href="#">Login</a></li>
        </ul>
    </nav>
    <main class="adservice-page">
        <h1>Set working hours</h1>
        <p class="subtitle">Single day or a date range; one row per day in the range.</p>

        <form id="working-hours-form" class="adservice-form">
            <fieldset class="working-hours-mode-fieldset">
                <legend class="working-hours-legend">Schedule type</legend>
                <div class="working-hours-mode-row">
                    <label class="working-hours-radio-label">
                        <input type="radio" name="scheduleMode" value=1 id="schedule-mode-single" checked>
                        Single day
                    </label>
                    <label class="working-hours-radio-label">
                        <input type="radio" name="scheduleMode" value=2 id="schedule-mode-week">
                        Weekly schedule
                    </label>
                </div>
            </fieldset>

            <div id="single-day-panel" class="working-hours-panel">
                <label for="work-date">Date</label>
                <input id="work-date" type="date" name="date">
                <div class="working-hours-time-row" id="single-day-times">
                    <div class="working-hours-time-field">
                        <label for="wh-single-start">Start</label>
                        <input id="wh-single-start" type="time" name="startTime">
                    </div>
                    <div class="working-hours-time-field">
                        <label for="wh-single-end">End</label>
                        <input id="wh-single-end" type="time" name="endTime">
                    </div>
                </div>
            </div>

            <div id="weekly-panel" class="working-hours-panel" hidden>
                <p class="working-hours-block-label"><strong>Start</strong> / <strong>Finish</strong> dates, then set each day. Uncheck <strong>Open</strong> to close.</p>
                <div class="working-hours-range-row working-hours-time-row" id="weekly-range-fields">
                    <div class="working-hours-time-field">
                        <label for="wh-range-start">Start</label>
                        <input type="date" id="wh-range-start" name="weeklyRangeStart" autocomplete="off">
                    </div>
                    <div class="working-hours-time-field">
                        <label for="wh-range-finish">Finish</label>
                        <input type="date" id="wh-range-finish" name="weeklyRangeFinish" autocomplete="off">
                    </div>
                </div>
                <div class="working-hours-week-head" aria-hidden="true">
                    <span>Day</span>
                    <span>Open</span>
                    <span>Start</span>
                    <span>End</span>
                </div>
                <div id="weekly-rows-root" class="working-hours-week-list" role="group" aria-label="Hours per day">
                </div>
            </div>

            <button type="submit" id="working-hours-save">Save hours</button>
        </form>
    </main>
    <script src="/setWorkingHours.js"></script>
    <script src="/artistNavbar.js"></script>
    <script src="/script.js"></script>
    <script src="/api.js"></script>
</body>
</html>
