<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoglalóPlusz — Szalon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light border-bottom salonic-navbar">
        <div class="container-fluid">
            <a class="navbar-brand logo p-0" id="logoLink" href="/Salon"><img src="/img/Foglaloplusz_Logo.svg" alt="FoglalóPlusz" height="40" width="auto" /></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#guestNavCollapse" aria-controls="guestNavCollapse" aria-expanded="false" aria-label="Menü">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="guestNavCollapse">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 nav-links align-items-lg-center gap-lg-1">
                    <li class="nav-item"><a class="nav-link" id="homeLink" href="#">Kezdőlap</a></li>
                    <li class="nav-item"><a class="nav-link" id="servicesLink" href="#">Szolgáltatások</a></li>
                    <li class="nav-item"><a class="nav-link" id="artistsLink" href="#">Szakemberek</a></li>
                    <li class="nav-item"><a class="nav-link" id="userLink" href="#">Profil</a></li>
                    <li class="nav-item"><a class="nav-link" id="loginLink" href="#">Bejelentkezés</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container py-4 py-lg-5 salon-landing user-page salonic-page-enter">
        <section id="salon-info" class="salon-landing-hero user-profile">
            <h1 id="salon-name"></h1>
            <p id="salon-description" class="salon-landing-lead"></p>
        </section>

        <section class="salon-landing-section" aria-labelledby="salon-svc-heading">
            <h2 id="salon-svc-heading" class="section-title">Szolgáltatások</h2>
            <ul id="salon-services-list" class="salon-landing-list"></ul>
            <p id="salon-services-empty" class="salon-landing-empty" hidden>Nincs még közzétett szolgáltatás.</p>
        </section>

        <section class="salon-landing-section" aria-labelledby="salon-art-heading">
            <h2 id="salon-art-heading" class="section-title">Szakemberek</h2>
            <ul id="salon-artists-list" class="salon-landing-list"></ul>
            <p id="salon-artists-empty" class="salon-landing-empty" hidden>Nincs még szakember.</p>
        </section>

        <div class="salon-landing-actions" role="navigation" aria-label="Gyors linkek">
            <a id="salon-link-services" class="salon-landing-cta" href="#">Összes szolgáltatás</a>
            <a id="salon-link-artists" class="salon-landing-cta salon-landing-cta--secondary" href="#">Szakemberek oldal</a>
        </div>

        <footer class="salon-landing-footer" id="salon-landing-footer" aria-label="Elérhetőség">
            <p class="salon-landing-footer__meta" id="salon-footer-meta"></p>
        </footer>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/api.js"></script>
    <script src="/common.js"></script>
    <script src="/navbar.js"></script>
    <script src="/homePage.js"></script>
    <script src="/script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <script src="/buttonFeedback.js"></script>
</body>
</html>
