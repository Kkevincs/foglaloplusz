<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salonic — Salon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="salon-home-page">
    <nav class="navbar navbar-expand-lg navbar-light salonic-navbar">
        <div class="container-fluid">
            <a class="navbar-brand logo p-0" id="logoLink" href="#"><img src="/img/Salonic_Logo.png" alt="Salonic" height="40" width="auto" /></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#guestNav" aria-controls="guestNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="guestNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 nav-links gap-lg-2">
                    <li class="nav-item"><a class="nav-link" id="homeLink" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" id="servicesLink" href="#">Services</a></li>
                    <li class="nav-item"><a class="nav-link" id="artistsLink" href="#">Artists</a></li>
                    <li class="nav-item"><a class="nav-link" id="userLink" href="#">User</a></li>
                    <li class="nav-item"><a class="nav-link" id="loginLink" href="#">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container py-4 py-lg-5 salonic-main salonic-main--wide salonic-page-enter salon-home-main">
        <section class="salon-home-hero rounded-4 p-4 p-lg-5 mb-4 text-center" aria-labelledby="salon-name">
            <div id="salon-info" class="salon-home-brand">
                <h1 id="salon-name" class="salon-home-title mb-3">Loading...</h1>
                <p id="salon-description" class="salon-home-lead subtitle mb-4">Loading...</p>
                <a id="salon-support-email" class="btn btn-outline-primary salon-home-contact-link" href="#">Loading...</a>
            </div>
        </section>

        <section class="salon-home-tiles" aria-label="Explore this salon">
            <h2 class="salon-home-section-title text-center mb-3">Explore</h2>
            <div class="row g-3 g-lg-4">
                <div class="col-md-4">
                    <a id="salon-link-services" class="salon-home-tile" href="#">
                        <span class="salon-home-tile-icon" aria-hidden="true">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M9 3a1 1 0 011-1h1a1 1 0 011 1v1.09a6 6 0 013.91 3.91H17a1 1 0 011 1v1a1 1 0 01-1 1h-1.09a6 6 0 01-3.91 3.91V17a1 1 0 01-1 1h-1a1 1 0 01-1-1v-1.09a6 6 0 01-3.91-3.91H3a1 1 0 01-1-1v-1a1 1 0 011-1h1.09A6 6 0 019 4.09V3z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M15 15l6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                        </span>
                        <span class="salon-home-tile-title">Services</span>
                        <span class="salon-home-tile-desc">Browse treatments and prices</span>
                    </a>
                </div>
                <div class="col-md-4">
                    <a id="salon-link-artists" class="salon-home-tile" href="#">
                        <span class="salon-home-tile-icon" aria-hidden="true">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="1.5"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                        </span>
                        <span class="salon-home-tile-title">Artists</span>
                        <span class="salon-home-tile-desc">Meet the team</span>
                    </a>
                </div>
                <div class="col-md-4">
                    <a id="salon-link-contact" class="salon-home-tile" href="#">
                        <span class="salon-home-tile-icon" aria-hidden="true">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke="currentColor" stroke-width="1.5"/><path d="M22 6l-10 7L2 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                        </span>
                        <span class="salon-home-tile-title">Contact</span>
                        <span class="salon-home-tile-desc">Email the salon</span>
                    </a>
                </div>
            </div>
        </section>

        <section class="salon-home-role mt-4 mt-lg-5" aria-label="Sign in options" data-hide-role-when="any">
            <div class="salon-home-role-card text-center p-4 p-lg-4 rounded-4">
                <p class="salon-home-role-eyebrow mb-1">Sign in</p>
                <p class="salon-home-role-label mb-3">Booking as a guest or signing in as staff?</p>
                <div class="d-flex flex-wrap justify-content-center gap-2">
                    <a id="salon-guest-login-link" class="btn btn-primary px-4" href="#">Guest login</a>
                    <a id="salon-artist-login-link" class="btn btn-outline-secondary px-4" href="#">Artist login</a>
                </div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/navbar.js"></script>
    <script src="/api.js"></script>
    <script src="/common.js"></script>
    <script src="/homePage.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <script src="/buttonFeedback.js"></script>
</body>
</html>
