<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salonic — Salon owner login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <nav>
        <a href="/maker" class="logo"><img src="/img/Salonic_Logo.png" alt="Salonic" /></a>
        <ul class="nav-links">
            <li><a href="/ownerregister">Register</a></li>
        </ul>
    </nav>
    <main class="auth-page">
        <h1>Salon owner login</h1>
        <form id="owner-login-form" class="auth-form">
            <input id="OwnerLoginEmail" type="email" name="email" placeholder="Email" required>
            <input id="OwnerLoginPassword" type="password" name="password" placeholder="Password" required>
            <button type="submit">Log in</button>
        </form>
        <p class="auth-switch">New to Salonic? <a href="/ownerregister">Create an owner account</a></p>
    </main>
    <script src="/api.js"></script>
    <script src="/script.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <script src="/buttonFeedback.js"></script>
</body>
</html>
