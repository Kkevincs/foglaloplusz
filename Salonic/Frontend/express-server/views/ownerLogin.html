<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoglalóPlusz — Tulajdonos bejelentkezés</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="portal-body owner-auth-page">
    <header class="portal-header">
        <nav class="navbar navbar-expand-lg navbar-light salonic-navbar w-100 py-2">
            <div class="container-fluid" style="max-width:1100px;margin:0 auto;">
                <a class="navbar-brand portal-brand p-0" href="/portal"><img src="/img/Foglaloplusz_Logo.svg" alt="FoglalóPlusz" height="40" width="auto" /></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#ownerAuthNav" aria-controls="ownerAuthNav" aria-expanded="false" aria-label="Menü">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="ownerAuthNav">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 portal-nav-links gap-lg-2">
                        <li class="nav-item"><a class="nav-link" href="/portal">Portál</a></li>
                        <li class="nav-item"><a class="nav-link" href="/ownerregister">Regisztráció</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <div class="owner-auth-card salonic-page-enter">
            <h1>Tulajdonos bejelentkezés</h1>
            <p class="subtitle">Jelentkezz be a szalonjaid és a csapat kezeléséhez.</p>
            <form id="owner-login-form" class="auth-form" autocomplete="on">
                <label class="field-label" for="OwnerLoginEmail">E-mail</label>
                <input id="OwnerLoginEmail" class="form-control" type="email" name="email" placeholder="te@pelda.hu" required autocomplete="username">
                <label class="field-label" for="OwnerLoginPassword">Jelszó</label>
                <input id="OwnerLoginPassword" class="form-control" type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                <button type="submit" class="btn btn-primary w-100">Belépés</button>
            </form>
            <p class="auth-switch">Új vagy a FoglalóPluszban? <a href="/ownerregister">Tulajdonos fiók létrehozása</a></p>
            <p class="auth-switch auth-switch-spaced">Nem tulajdonos vagy? <a href="/portal">Vissza a portálra</a></p>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/api.js"></script>
    <script src="/script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <script src="/buttonFeedback.js"></script>
</body>
</html>
