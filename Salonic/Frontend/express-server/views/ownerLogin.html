<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salonic — Salon owner login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="theme-pink">
    <nav class="navbar navbar-expand-lg navbar-light salonic-navbar">
        <div class="container-fluid">
            <a class="navbar-brand logo p-0" href="/maker"><img src="/img/Salonic_Logo.png" alt="Salonic" height="40" /></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#ownerNav" aria-controls="ownerNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="ownerNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-lg-2">
                    <li class="nav-item"><a class="nav-link" href="/ownerregister">Register</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container py-4 py-lg-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5 text-center salonic-main salonic-page-enter auth-page auth-page-card">
                <h1 class="h3 mb-3">Salon owner login</h1>
                <form id="owner-login-form" class="auth-form text-start d-grid gap-3">
                    <div>
                        <label for="OwnerLoginEmail" class="form-label">Email</label>
                        <input id="OwnerLoginEmail" class="form-control" type="email" name="email" placeholder="you@example.com" required autocomplete="username">
                    </div>
                    <div>
                        <label for="OwnerLoginPassword" class="form-label">Password</label>
                        <input id="OwnerLoginPassword" class="form-control" type="password" name="password" placeholder="Password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Log in</button>
                </form>
                <p class="auth-switch mt-3 mb-0">New to Salonic? <a href="/ownerregister">Create an owner account</a></p>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/api.js"></script>
    <script src="/common.js"></script>
    <script src="/ownerLoginPage.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <script src="/buttonFeedback.js"></script>
</body>
</html>
