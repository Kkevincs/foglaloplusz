<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoglalóPlusz — Szalon irányítópult</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="portal-body owner-app-page">
    <header class="portal-header">
        <nav class="navbar navbar-expand-lg navbar-light salonic-navbar w-100 py-2">
            <div class="container-fluid" style="max-width:1100px;margin:0 auto;">
                <a class="navbar-brand portal-brand p-0" href="/ownerhomepage"><img src="/img/Foglaloplusz_Logo.svg" alt="FoglalóPlusz" height="40" width="auto" /></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#ownerPortalNav" aria-controls="ownerPortalNav" aria-expanded="false" aria-label="Menü">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="ownerPortalNav">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 portal-nav-links gap-lg-2">
                        <li class="nav-item"><a class="nav-link" href="/ownerhomepage">Szalonjaim</a></li>
                        <li class="nav-item"><a class="nav-link" href="/maker">Új szalon felvétele</a></li>
                        <li class="nav-item"><a class="nav-link" href="/owneruserpage">Fiók</a></li>
                        <li class="nav-item"><a class="nav-link" onclick="localStorage.setItem('token', '')" href="/ownerlogin">Kijelentkezés</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="container py-4 salon-dashboard-page salonic-page-enter">
        <header class="salon-dashboard-header">
            <h1 class="h3">Szalon irányítópult</h1>
            <p class="subtitle">Szakemberek, szolgáltatások és időpontok egy helyen.</p>
        </header>

        <section class="salon-dash-section" aria-labelledby="dash-artists-heading">
            <h2 id="dash-artists-heading" class="salon-dash-section-title">Szakemberek</h2>
            <ul id="salon-dash-artists" class="salon-dash-artists"></ul>
        </section>

        <section class="salon-dash-section" aria-labelledby="dash-services-heading">
            <h2 id="dash-services-heading" class="salon-dash-section-title">Szolgáltatások</h2>
            <div class="salon-dash-table-wrap table-responsive">
                <table class="salon-dash-table table table-sm align-middle">
                    <thead>
                        <tr>
                            <th scope="col">Szolgáltatás</th>
                            <th scope="col">Időtartam</th>
                            <th scope="col">Ár</th>
                        </tr>
                    </thead>
                    <tbody id="services-table"></tbody>
                </table>
            </div>
        </section>

        <section class="salon-dash-section" aria-labelledby="dash-appointments-heading">
            <h2 id="dash-appointments-heading" class="salon-dash-section-title">Időpontok</h2>
            <div class="salon-dash-table-wrap table-responsive">
                <table class="salon-dash-table salon-dash-table-appointments">
                    <thead>
                        <tr>
                            <th scope="col">Dátum és idő</th>
                            <th scope="col">Szakember</th>
                            <th scope="col">Vendég</th>
                            <th scope="col">Szolgáltatás</th>
                        </tr>
                    </thead>
                    <tbody id="apps-table"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/api.js"></script>
    <script src="/common.js"></script>
    <script src="/script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <script src="/buttonFeedback.js"></script>
</body>
</html>
