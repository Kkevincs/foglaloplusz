<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salonic — Salon dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="theme-pink owner-area-page">
    <nav class="navbar navbar-expand-lg navbar-light salonic-navbar">
        <div class="container-fluid">
            <a class="navbar-brand logo p-0" href="/ownerhomepage"><img src="/img/Salonic_Logo.png" alt="Salonic" height="40" /></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#ownerNav" aria-controls="ownerNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="ownerNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-lg-2">
                    <li class="nav-item"><a class="nav-link" href="/ownerhomepage">My salons</a></li>
                    <li class="nav-item"><a class="nav-link" href="/maker">New salon setup</a></li>
                    <li class="nav-item"><a class="nav-link" href="/owneruserpage">Account</a></li>
                    <li class="nav-item"><a class="nav-link" onclick="localStorage.setItem('token', '')" href="/ownerlogin">Log out</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container py-4 py-lg-5 salon-dashboard-page salonic-main salonic-main--wide">
        <header class="salon-dashboard-header">
            <h1 class="h3 mb-2">Bloom Hair Studio</h1>
            <p class="subtitle mb-0">Salon dashboard</p>
        </header>

        <section class="salon-dash-section mt-5" aria-labelledby="dash-artists-heading">
            <h2 id="dash-artists-heading" class="salon-dash-section-title h5">Artists</h2>
            <ul id="salon-dash-artists" class="salon-dash-artists list-unstyled"></ul>
        </section>

        <section class="salon-dash-section owner-content-panel mb-4" aria-labelledby="dash-services-heading">
            <h2 id="dash-services-heading" class="salon-dash-section-title h5">Services</h2>
            <div class="salon-dash-table-wrap table-responsive">
                <table class="salon-dash-table table table-sm mb-0">
                    <thead>
                        <tr>
                            <th scope="col">Service</th>
                            <th scope="col">Duration</th>
                            <th scope="col">Price</th>
                        </tr>
                    </thead>
                    <tbody id="services-table"></tbody>
                </table>
            </div>
        </section>

        <section class="salon-dash-section owner-content-panel mb-0" aria-labelledby="dash-appointments-heading">
            <h2 id="dash-appointments-heading" class="salon-dash-section-title h5">Appointments</h2>
            <div class="salon-dash-table-wrap table-responsive">
                <table class="salon-dash-table salon-dash-table-appointments table table-sm mb-0">
                    <thead>
                        <tr>
                            <th scope="col">Date &amp; time</th>
                            <th scope="col">Guest</th>
                            <th scope="col">Artist</th>
                            <th scope="col">Service</th>
                        </tr>
                    </thead>
                    <tbody id="apps-table"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/common.js"></script>
    <script src="/salonDashboardPage.js"></script>
    <script src="/api.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <script src="/buttonFeedback.js"></script>
</body>
</html>
