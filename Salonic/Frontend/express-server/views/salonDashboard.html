<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoglalóPlusz — Szalon irányítópult</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="portal-body owner-app-page">
    <header class="portal-header">
        <div class="portal-header-inner portal-header-inner--split">
            <a href="/ownerhomepage" class="portal-brand"><img src="/img/Foglaloplusz_Logo.svg" alt="FoglalóPlusz" /></a>
            <ul class="portal-nav-links">
                <li><a href="/ownerhomepage">Szalonjaim</a></li>
                <li><a href="/maker">Új szalon felvétele</a></li>
                <li><a href="/owneruserpage">Fiók</a></li>
                <li><a onclick="localStorage.setItem('token', '')" href="/ownerlogin">Kijelentkezés</a></li>
            </ul>
        </div>
    </header>
    <main class="salon-dashboard-page">
        <header class="salon-dashboard-header">
            <h1>Szalon irányítópult</h1>
            <p class="subtitle">Szakemberek, szolgáltatások és időpontok egy helyen.</p>
        </header>

        <section class="salon-dash-section" aria-labelledby="dash-artists-heading">
            <h2 id="dash-artists-heading" class="salon-dash-section-title">Szakemberek</h2>
            <ul id="salon-dash-artists" class="salon-dash-artists">
                
                
            </ul>
        </section>

        <section class="salon-dash-section" aria-labelledby="dash-services-heading">
            <h2 id="dash-services-heading" class="salon-dash-section-title">Szolgáltatások</h2>
            <div class="salon-dash-table-wrap">
                <table class="salon-dash-table">
                    <thead>
                        <tr>
                            <th scope="col">Szolgáltatás</th>
                            <th scope="col">Időtartam</th>
                            <th scope="col">Ár</th>
                        </tr>
                    </thead>
                    <tbody id="services-table">
                        
                        
                    </tbody>
                </table>
            </div>
        </section>

        <section class="salon-dash-section" aria-labelledby="dash-appointments-heading">
            <h2 id="dash-appointments-heading" class="salon-dash-section-title">Időpontok</h2>
            <div class="salon-dash-table-wrap">
                <table class="salon-dash-table salon-dash-table-appointments">
                    <thead>
                        <tr>
                            <th scope="col">Dátum és idő</th>
                            <th scope="col">Szakember</th>
                            <th scope="col">Vendég</th>
                            <th scope="col">Szolgáltatás</th>
                        </tr>
                    </thead>
                    <tbody id="apps-table">
                        
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="/script.js"></script>
    <script src="/api.js"></script>
</body>
</html>
