<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Salonic — Register</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/styles.css">

</head>

<body>

    <nav>

        <a href="/Salon" class="logo"><img src="/img/Salonic_Logo.png" alt="Salonic" /></a>

        <ul class="nav-links">

            <li><a id="homeLink" href="#">Home</a></li>

            <li><a id="servicesLink" href="#">Services</a></li>

            <li><a id="artistsLink" href="#">Artists</a></li>

            <li><a href="/Salon/Services">Book</a></li>

            <li><a id="userLink" href="#">User</a></li>

            <li><a id="loginLink" href="#">Login</a></li>

            <li><a href="/Salon/Forms">Create salon</a></li>

        </ul>

    </nav>

    <main class="auth-page">

        <h1>Register</h1>

        <form id="guest-register-form" class="auth-form">

            <input id="Name" type="text" name="name" placeholder="Name" required>

            <input id="Email" type="email" name="email" placeholder="Email" required>

            <input id="Password" type="password" name="password" placeholder="Password" required>

            <button type="submit">Create account</button>

        </form>

        <p class="auth-switch">Already have an account? <a id="auth-switch" href="#">Login</a></p>

    </main>

    <script src="/api.js"></script>

    <script src="/navbar.js"></script>

    <script src="/script.js"></script>

    <script>

        document.getElementById("auth-switch").href = "/Salon/Login";

    </script>

</body>

</html>
