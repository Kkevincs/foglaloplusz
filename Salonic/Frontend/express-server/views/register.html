<!DOCTYPE html>

<html lang="hu">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoglalóPlusz — Regisztráció</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/styles.css">

</head>

<body>

    <nav>

        <a href="/Salon" class="logo"><img src="/img/Foglaloplusz_Logo.svg" alt="FoglalóPlusz" /></a>

        <ul class="nav-links">

            <li><a id="homeLink" href="#">Kezdőlap</a></li>

            <li><a id="servicesLink" href="#">Szolgáltatások</a></li>

            <li><a id="artistsLink" href="#">Szakemberek</a></li>

            <li><a id="bookLink" href="/Salon/Services">Foglalás</a></li>

            <li><a id="userLink" href="#">Profil</a></li>

            <li><a id="loginLink" href="#">Bejelentkezés</a></li>

        </ul>

    </nav>

    <main class="auth-page">

        <h1>Regisztráció</h1>

        <form id="guest-register-form" class="auth-form">

            <input id="Name" type="text" name="name" placeholder="Név" required>

            <input id="Email" type="email" name="email" placeholder="E-mail" required>

            <input id="Password" type="password" name="password" placeholder="Jelszó" required>

            <button type="submit">Fiók létrehozása</button>

        </form>

        <p class="auth-switch">Már van fiókod? <a id="auth-switch" href="#">Bejelentkezés</a></p>

    </main>

    <script src="/api.js"></script>

    <script src="/navbar.js"></script>

    <script src="/script.js"></script>

    <script>

        document.getElementById("auth-switch").href = "/Salon/Login";

    </script>

</body>

</html>
