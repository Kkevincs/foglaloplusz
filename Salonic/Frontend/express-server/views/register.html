<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoglalóPlusz — Regisztráció</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <script src="/themeBoot.js"></script>
    <nav class="navbar navbar-expand-lg navbar-light border-bottom salonic-navbar">
        <div class="container-fluid">
            <a class="navbar-brand logo p-0" id="logoLink" href="/Salon"><img src="/img/Foglaloplusz_Logo.svg" alt="FoglalóPlusz" height="40" width="auto" /></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#guestNavCollapse" aria-controls="guestNavCollapse" aria-expanded="false" aria-label="Menü">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="guestNavCollapse">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 nav-links align-items-lg-center gap-lg-1">
                    <li class="nav-item"><a class="nav-link" id="homeLink" href="#">Kezdőlap</a></li>
                    <li class="nav-item"><a class="nav-link" id="servicesLink" href="#">Szolgáltatások</a></li>
                    <li class="nav-item"><a class="nav-link" id="artistsLink" href="#">Szakemberek</a></li>
                    <li class="nav-item"><a class="nav-link" id="userLink" href="#">Profil</a></li>
                    <li class="nav-item"><a class="nav-link" id="loginLink" href="#">Bejelentkezés</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container py-4 py-lg-5 salonic-page-enter">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 auth-page">
                        <h1 class="h4 mb-3">Regisztráció</h1>
                        <form id="guest-register-form" class="auth-form">
                            <input id="Name" class="form-control" type="text" name="name" placeholder="Név" required>
                            <input id="Email" class="form-control" type="email" name="email" placeholder="E-mail" required>
                            <input id="Password" class="form-control" type="password" name="password" placeholder="Jelszó" required>
                            <button type="submit" class="btn btn-primary w-100">Fiók létrehozása</button>
                        </form>
                        <p class="auth-switch mb-0">Már van fiókod? <a id="auth-switch" href="#">Bejelentkezés</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/api.js"></script>
    <script src="/common.js"></script>
    <script src="/navbar.js"></script>
    <script src="/script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <script src="/buttonFeedback.js"></script>
    <script>
        const _loginSwitch = document.getElementById("auth-switch");
        if (_loginSwitch) {
            const q = window.location.search;
            _loginSwitch.href = q ? `/Salon/Login${q}` : "/Salon/Login";
        }
    </script>
</body>
</html>
