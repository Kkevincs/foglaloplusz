<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoglalóPlusz — Szakember naptár</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="portal-body owner-app-page">
    <header class="portal-header">
        <div class="portal-header-inner portal-header-inner--split">
            <a href="/ownerhomepage" class="portal-brand"><img src="/img/Foglaloplusz_Logo.svg" alt="FoglalóPlusz" /></a>
            <ul class="portal-nav-links">
                <li><a href="/ownerhomepage">Szalonjaim</a></li>
                <li><a href="/maker">Új szalon felvétele</a></li>
                <li><a href="/owneruserpage">Fiók</a></li>
                <li><a onclick="localStorage.setItem('token', '')" href="/ownerlogin">Kijelentkezés</a></li>
            </ul>
        </div>
    </header>
    <main class="salon-schedule-page">
        <div class="salon-schedule-toolbar">
            <a id="schedule-back" href="/salondashboard" class="owner-btn owner-btn-ghost schedule-back-link">← Vissza az irányítópultra</a>
        </div>

        <header class="salon-schedule-header">
            <p class="salon-schedule-label">Heti elérhetőség</p>
            <h1>Szakember naptár</h1>
            <p class="subtitle">Nyitvatartás, foglalások és zárás a kiválasztott héten.</p>
            <div class="salon-schedule-meta">
                <span class="salon-schedule-meta-item" id="schedule-artist-label">Szakember</span>
                <span class="salon-schedule-meta-sep" aria-hidden="true">·</span>
                <span class="salon-schedule-meta-item" id="schedule-week-label">Hét</span>
            </div>
        </header>

        <section class="salon-schedule-controls" aria-label="Hét lapozása">
            <button type="button" id="schedule-nav-prev" class="owner-btn schedule-nav-btn" disabled>Előző hét</button>
            <button type="button" id="schedule-nav-next" class="owner-btn schedule-nav-btn" disabled>Következő hét</button>
        </section>

        <section class="salon-schedule-board" aria-labelledby="schedule-board-title">
            <h2 id="schedule-board-title" class="visually-hidden">Heti rács</h2>
            <div id="schedule-grid-mount"></div>
        </section>

        <section class="salon-schedule-legend" aria-label="Jelmagyarázat">
            <span class="schedule-legend-item"><span class="schedule-legend-swatch schedule-pill-open"></span> Szabad</span>
            <span class="schedule-legend-item"><span class="schedule-legend-swatch schedule-pill-booked"></span> Foglalt</span>
            <span class="schedule-legend-item"><span class="schedule-legend-swatch schedule-legend-muted"></span> Zárva</span>
        </section>
    </main>
    <script src="/api.js"></script>
    <script src="/script.js"></script>
</body>
</html>
