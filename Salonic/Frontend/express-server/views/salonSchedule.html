<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoglalóPlusz — Szakember naptár</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="portal-body owner-app-page">
    <header class="portal-header">
        <nav class="navbar navbar-expand-lg navbar-light salonic-navbar w-100 py-2">
            <div class="container-fluid" style="max-width:1100px;margin:0 auto;">
                <a class="navbar-brand portal-brand p-0" href="/ownerhomepage"><img src="/img/Foglaloplusz_Logo.svg" alt="FoglalóPlusz" height="40" width="auto" /></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#ownerPortalNav" aria-controls="ownerPortalNav" aria-expanded="false" aria-label="Menü">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="ownerPortalNav">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 portal-nav-links gap-lg-2">
                        <li class="nav-item"><a class="nav-link" href="/ownerhomepage">Szalonjaim</a></li>
                        <li class="nav-item"><a class="nav-link" href="/maker">Új szalon felvétele</a></li>
                        <li class="nav-item"><a class="nav-link" href="/owneruserpage">Fiók</a></li>
                        <li class="nav-item"><a class="nav-link" href="#" data-salonic-logout-href="/ownerlogin">Kijelentkezés</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="salon-schedule-page salonic-page-enter">
        <div class="salon-schedule-toolbar">
            <a id="schedule-back" href="/salondashboard" class="owner-btn owner-btn-ghost schedule-back-link">← Vissza az irányítópultra</a>
        </div>

        <header class="salon-schedule-header">
            <p class="salon-schedule-label">Heti elérhetőség</p>
            <h1 class="h3">Szakember naptár</h1>
            <p class="subtitle">Nyitvatartás, foglalások és zárás a kiválasztott héten.</p>
            <div class="salon-schedule-meta">
                <span class="salon-schedule-meta-item" id="schedule-artist-label">Szakember</span>
                <span class="salon-schedule-meta-sep" aria-hidden="true">·</span>
                <span class="salon-schedule-meta-item" id="schedule-week-label">Hét</span>
            </div>
        </header>

        <section class="salon-schedule-controls" aria-label="Hét lapozása">
            <button type="button" id="schedule-nav-prev" class="owner-btn schedule-nav-btn" disabled>Előző hét</button>
            <button type="button" id="schedule-nav-next" class="owner-btn schedule-nav-btn" disabled>Következő hét</button>
        </section>

        <section class="salon-schedule-board" aria-labelledby="schedule-board-title">
            <h2 id="schedule-board-title" class="visually-hidden">Heti rács</h2>
            <div id="schedule-grid-mount"></div>
        </section>

        <section class="salon-schedule-legend" aria-label="Jelmagyarázat">
            <span class="schedule-legend-item"><span class="schedule-legend-swatch schedule-pill-open"></span> Szabad</span>
            <span class="schedule-legend-item"><span class="schedule-legend-swatch schedule-pill-booked"></span> Foglalt</span>
            <span class="schedule-legend-item"><span class="schedule-legend-swatch schedule-legend-muted"></span> Zárva</span>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/api.js"></script>
    <script src="/common.js"></script>
    <script src="/script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <script src="/buttonFeedback.js"></script>
</body>
</html>
