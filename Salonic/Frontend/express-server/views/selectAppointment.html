<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salonic — Select appointment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light salonic-navbar">
        <div class="container-fluid">
            <a class="navbar-brand logo p-0" id="logoLink" href="#"><img src="/img/Salonic_Logo.png" alt="Salonic" height="40" /></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#guestNav" aria-controls="guestNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="guestNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 nav-links gap-lg-2">
                    <li class="nav-item"><a class="nav-link" id="homeLink" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" id="servicesLink" href="#">Services</a></li>
                    <li class="nav-item"><a class="nav-link" id="artistsLink" href="#">Artists</a></li>
                    <li class="nav-item"><a class="nav-link" id="userLink" href="#">User</a></li>
                    <li class="nav-item"><a class="nav-link" id="loginLink" href="#">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container py-4 py-lg-5 appointment-page salonic-main salonic-main--wide">
        <h1 class="h3 mb-2">Select date &amp; time</h1>
        <p class="subtitle mb-4">Choose when you’d like to come in.</p>

        <div class="appointment-layout">
            <section class="calendar-card" aria-label="Choose date">
                <label for="appointment-date" class="calendar-header d-block mb-2">Date</label>
                <input type="date" id="appointment-date" class="form-control" name="appointment-date" required>
            </section>

            <div class="times-panel">
                <h2 class="section-title h6">Available times</h2>
                <ul id="time-slots" class="time-slots" aria-label="Available times"></ul>
            </div>
            <button type="button" class="btn btn-primary" onclick="SaveDate()">Save date</button>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/navbar.js"></script>
    <script src="/api.js"></script>
    <script src="/common.js"></script>
    <script src="/appointment.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <script src="/buttonFeedback.js"></script>
</body>
</html>
