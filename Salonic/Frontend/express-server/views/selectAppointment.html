<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoglalóPlusz — Időpont választása</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <nav>
        <a href="/Salon" class="logo"><img src="/img/Foglaloplusz_Logo.svg" alt="FoglalóPlusz" /></a>
        <ul class="nav-links">
            <li><a id="homeLink" href="#">Kezdőlap</a></li>
            <li><a id="servicesLink" href="#">Szolgáltatások</a></li>
            <li><a id="artistsLink" href="#">Szakemberek</a></li>
            <li><a id="bookLink" href="/Salon/Services">Foglalás</a></li>
            <li><a id="userLink" href="#">Profil</a></li>
            <li><a id="loginLink" href="#">Bejelentkezés</a></li>
        </ul>
    </nav>
    <main class="appointment-page">
        <h1>Dátum és időpont</h1>
        <p class="subtitle">Válaszd ki, mikor szeretnél érkezni.</p>

        <div class="appointment-layout">
            <section class="calendar-card" aria-label="Dátum választása">
                <label for="appointment-date" class="calendar-header">Dátum</label>
                <input type="date" id="appointment-date" name="appointment-date" required>
            </section>

            <div class="times-panel">
                <h2 class="section-title">Szabad időpontok</h2>
                <ul id="time-slots" class="time-slots" aria-label="Szabad időpontok">
                    
                    
                </ul>
            </div>
            <button onclick="SaveDate()">Időpont mentése</button>
        </div>
    </main>
    <script src="/navbar.js"></script>
    <script src="/api.js"></script>
    <script src="/script.js"></script>
    <script src="/appointment.js"></script>
</body>
</html>
