<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salonic — Select appointment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <nav>
        <a id="logoLink" href="#" class="logo"><img src="/img/Salonic_Logo.png" alt="Salonic"/></a>
        <ul class="nav-links">
            <li><a id="homeLink" href="#">Home</a></li>
            <li><a id="servicesLink" href="#">Services</a></li>
            <li><a id="artistsLink" href="#">Artists</a></li>
            <li><a id="bookLink" href="/Salon/Services">Book</a></li>
            <li><a id="userLink" href="#">User</a></li>
            <li><a id="loginLink" href="#">Login</a></li>
        </ul>
    </nav>
    <main class="appointment-page">
        <h1>Select date & time</h1>
        <p class="subtitle">Choose when you’d like to come in. (Template — no booking yet.)</p>

        <div class="appointment-layout">
            <section class="calendar-card" aria-label="Choose date">
                <label for="appointment-date" class="calendar-header">Date</label>
                <input type="date" id="appointment-date" name="appointment-date" required>
            </section>

            <div class="times-panel">
                <h2 class="section-title">Available times</h2>
                <ul id="time-slots" class="time-slots" aria-label="Available times">
                    
                    
                </ul>
            </div>
            <button type="button" class="btn-primary" onclick="SaveDate()">Save date</button>
        </div>
    </main>
    <script src="/navbar.js"></script>
    <script src="/api.js"></script>
    <script src="/script.js"></script>
    <script src="/appointment.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <script src="/buttonFeedback.js"></script>
</body>
</html>
