<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salonic — Artist Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="salon-auth-page artist-area-page">
    <nav class="navbar navbar-expand-lg navbar-light salonic-navbar">
        <div class="container-fluid">
            <a class="navbar-brand logo p-0" id="logoLink" href="#"><img src="/img/Salonic_Logo.png" alt="Salonic" height="40" /></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#artistNav" aria-controls="artistNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="artistNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 nav-links gap-lg-2">
                    <li class="nav-item"><a class="nav-link" id="homeLink" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" id="servicesLink" href="#">Services</a></li>
                    <li class="nav-item"><a class="nav-link" id="userLink" href="#">User</a></li>
                    <li class="nav-item"><a class="nav-link" id="addServiceLink" href="#">Add Service</a></li>
                    <li class="nav-item"><a class="nav-link" id="workingHoursLink" href="#">Hours</a></li>
                    <li class="nav-item"><a class="nav-link" id="loginLink" href="#">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container py-4 py-lg-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5 text-center salonic-main salonic-page-enter auth-page">
                <h1 class="h3 mb-3">Artist login</h1>
                <form id="artist-login-form" class="auth-form text-start d-grid gap-3">
                    <div>
                        <label for="ArtistEmail" class="form-label">Email</label>
                        <input id="ArtistEmail" class="form-control" type="email" name="email" required autocomplete="username">
                    </div>
                    <div>
                        <label for="ArtistPassword" class="form-label">Password</label>
                        <input id="ArtistPassword" class="form-control" type="password" name="password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Log in</button>
                </form>
                <p class="auth-switch mt-3 mb-0">Not an artist? <a id="switch-to-guest-login" href="/Salon/Login">Guest login</a></p>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/api.js"></script>
    <script src="/common.js"></script>
    <script src="/artistLoginPage.js"></script>
    <script src="/artistNavbar.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <script src="/buttonFeedback.js"></script>
    <script>
        (function () {
            function setCrossLoginHref() {
                var p = new URLSearchParams(window.location.search);
                var sid = p.get('salonId') || p.get('salonid');
                var a = document.getElementById('switch-to-guest-login');
                if (a) a.href = sid ? '/Salon/Login?salonId=' + encodeURIComponent(sid) : '/Salon/Login';
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setCrossLoginHref);
            else setCrossLoginHref();
        })();
    </script>
</body>
</html>
