<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salonic — Artist Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <nav>
        <a id="logoLink" href="#" class="logo">Salonic</a>
        <ul class="nav-links">
            <li><a id="homeLink" href="#">Home</a></li>
            <li><a id="servicesLink" href="#">Services</a></li>
            <li><a id="userLink" href="#">User</a></li>
            <li><a id="addServiceLink" href="#">Add Service</a></li>
            <li><a id="workingHoursLink" href="#">Hours</a></li>
            <li><a id="loginLink" href="#">Login</a></li>
        </ul>
    </nav>
    <main class="auth-page">
        <h1>Artist Login</h1>
        <form id="artist-login-form" class="auth-form">
            <input id="ArtistEmail" type="email" name="email" placeholder="Email" required>
            <input id="ArtistPassword" type="password" name="password" placeholder="Password" required>
            <button type="submit">Log in</button>
        </form>
        <p class="auth-switch">Not an artist? <a href="/Salon/Login">Guest login</a></p>
    </main>

    <script src="/artistNavbar.js"></script>
    <script src="/api.js"></script>
    <script src="/script.js"></script>

</body>
</html>
