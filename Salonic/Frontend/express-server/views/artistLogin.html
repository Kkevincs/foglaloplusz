<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoglalóPlusz — Szakember bejelentkezés</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <nav>
        <a id="logoLink" href="#" class="logo">FoglalóPlusz</a>
        <ul class="nav-links">
            <li><a id="homeLink" href="#">Kezdőlap</a></li>
            <li><a id="servicesLink" href="#">Szolgáltatások</a></li>
            <li><a id="userLink" href="#">Profil</a></li>
            <li><a id="addServiceLink" href="#">Új szolgáltatás</a></li>
            <li><a id="workingHoursLink" href="#">Nyitvatartás</a></li>
            <li><a id="loginLink" href="#">Bejelentkezés</a></li>
        </ul>
    </nav>
    <main class="auth-page">
        <h1>Szakember bejelentkezés</h1>
        <form id="artist-login-form" class="auth-form">
            <input id="ArtistEmail" type="email" name="email" placeholder="E-mail" required>
            <input id="ArtistPassword" type="password" name="password" placeholder="Jelszó" required>
            <button type="submit">Belépés</button>
        </form>
        <p class="auth-switch">Nem vagy szakember? <a href="/Salon/Login">Vendég bejelentkezés</a></p>
    </main>

    <script src="/api.js"></script>
    <script src="/script.js"></script>
    <script src="/artistNavbar.js"></script>

</body>
</html>
