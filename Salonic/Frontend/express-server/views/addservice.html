<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salonic - Add service</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <nav>
        <a id="logoLink" href="#" class="logo"><img src="/img/Salonic_Logo.png" alt="Salonic"/></a>
        <ul class="nav-links">
            <li><a id="homeLink" href="#">Home</a></li>
            <li><a id="servicesLink" href="#">Services</a></li>
            <li><a id="userLink" href="#">User</a></li>
            <li><a id="addServiceLink" href="#">Add Service</a></li>
            <li><a id="workingHoursLink" href="#">Hours</a></li>
            <li><a id="loginLink" href="#">Login</a></li>
        </ul>
    </nav>
    <main class="adservice-page">
        <h1>Add service</h1>
        <p class="subtitle">Offer a new service for your customers</p>

        <form id="addservice-form" class="adservice-form">
            <input id="name" type="text" name="name" placeholder="Service name" required>
            <input id="durationInMinute" type="number" name="durationInMinute" placeholder="Duration (minutes)" min="1" required>
            <input id="price" type="number" name="price" placeholder="Price" min="0" step="0.01" required>
            <textarea id="description" name="description" placeholder="Description" rows="4"></textarea>
            <button type="submit">Save service</button>
        </form>
    </main>
    <script src="/api.js"></script>
    <script src="/script.js"></script>
    <script src="/artistNavbar.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <script src="/buttonFeedback.js"></script>
</body>
</html>
