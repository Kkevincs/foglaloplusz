<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoglalóPlusz — Új szolgáltatás</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <nav>
        <a id="logoLink" href="#" class="logo">FoglalóPlusz</a>
        <ul class="nav-links">
            <li><a id="homeLink" href="#">Kezdőlap</a></li>
            <li><a id="servicesLink" href="#">Szolgáltatások</a></li>
            <li><a id="userLink" href="#">Profil</a></li>
            <li><a id="addServiceLink" href="#">Új szolgáltatás</a></li>
            <li><a id="workingHoursLink" href="#">Nyitvatartás</a></li>
            <li><a id="loginLink" href="#">Bejelentkezés</a></li>
        </ul>
    </nav>
    <main class="adservice-page">
        <h1>Új szolgáltatás</h1>
        <p class="subtitle">Hozz létre új szolgáltatást a szalonodnak.</p>

        <form id="addservice-form" class="adservice-form">
            <input id="name" type="text" name="name" placeholder="Szolgáltatás neve" required>
            <input id="durationInMinute" type="number" name="durationInMinute" placeholder="Időtartam (perc)" min="1" required>
            <input id="price" type="number" name="price" placeholder="Ár (Ft)" min="0" step="0.01" required>
            <textarea id="description" name="description" placeholder="Leírás" rows="4"></textarea>
            <button type="submit">Szolgáltatás mentése</button>
        </form>
    </main>
    <script src="/api.js"></script>
    <script src="/script.js"></script>
    <script src="/artistNavbar.js"></script>
</body>
</html>
