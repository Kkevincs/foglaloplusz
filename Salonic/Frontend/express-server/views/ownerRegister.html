<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salonic — Salon owner registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <nav>
        <a href="/maker" class="logo"><img src="/img/Salonic_Logo.png" alt="Salonic" /></a>
        <ul class="nav-links">
            <li><a href="/ownerlogin">Log in</a></li>
        </ul>
    </nav>
    <main class="auth-page">
        <h1>Register as salon owner</h1>
        <form id="owner-register-form" class="auth-form">
            <input id="OwnerRegName" type="text" name="name" placeholder="Full name" required>
            <input id="OwnerRegEmail" type="email" name="email" placeholder="Email" required>
            <input id="OwnerRegPassword" type="password" name="password" placeholder="Password" required>
            <button type="submit">Create owner account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="/ownerlogin">Log in</a></p>
        <p class="auth-switch auth-switch-spaced">After registering, you can <a href="/maker">set up your salon</a>.</p>
    </main>
    <script src="/api.js"></script>
    <script src="/script.js"></script>
</body>
</html>
