<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoglalóPlusz — Szolgáltatások</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light border-bottom salonic-navbar">
        <div class="container-fluid">
            <a class="navbar-brand logo p-0" id="logoLink" href="/Salon"><img src="/img/Foglaloplusz_Logo.svg" alt="FoglalóPlusz" height="40" width="auto" /></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#guestNavCollapse" aria-controls="guestNavCollapse" aria-expanded="false" aria-label="Menü">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="guestNavCollapse">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 nav-links align-items-lg-center gap-lg-1">
                    <li class="nav-item"><a class="nav-link" id="homeLink" href="#">Kezdőlap</a></li>
                    <li class="nav-item"><a class="nav-link" id="servicesLink" href="#">Szolgáltatások</a></li>
                    <li class="nav-item"><a class="nav-link" id="artistsLink" href="#">Szakemberek</a></li>
                    <li class="nav-item"><a class="nav-link" id="userLink" href="#">Profil</a></li>
                    <li class="nav-item"><a class="nav-link" id="loginLink" href="#">Bejelentkezés</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container py-4 py-lg-5 services-page services-page--picker salonic-page-enter">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">
                <section class="guest-booking-section" aria-labelledby="services-page-title">
                    <h1 id="services-page-title" class="h3 mb-2">Szolgáltatások</h1>
                    <p class="subtitle mb-4">Válassz egy vagy több szolgáltatást, majd lépj tovább a foglaláshoz.</p>
                    <div id="services-list" class="services-pick-list" role="list"></div>
                    <p id="services-page-empty" class="salon-landing-empty mt-3 mb-0" hidden role="status"></p>
                    <p id="services-page-error" class="text-danger small mt-3 mb-0" hidden role="alert"></p>
                </section>
            </div>
        </div>
    </main>

    <div id="services-cart-holder" class="services-cart-bar" hidden>
        <div class="services-cart-bar__inner">
            <div class="services-cart-bar__summary">
                <div id="services-cart-count" class="services-cart-bar__count">0 szolgáltatás</div>
                <div id="services-cart-totals" class="services-cart-bar__totals">0 perc — 0 Ft</div>
            </div>
            <button type="button" class="services-cart-bar__cta" id="AddToCart" onclick="AddToCart()">Tovább</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/api.js"></script>
    <script src="/common.js"></script>
    <script src="/navbar.js"></script>
    <script src="/servicesPage.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <script src="/buttonFeedback.js"></script>
</body>
</html>
