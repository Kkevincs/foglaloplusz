<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salonic — Artist login required</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="salon-auth-page artist-area-page">
    <nav class="navbar navbar-expand-lg navbar-light salonic-navbar">
        <div class="container-fluid">
            <a class="navbar-brand logo p-0" id="logoLink" href="#"><img src="/img/Salonic_Logo.png" alt="Salonic" height="40" /></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#artistNav" aria-controls="artistNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="artistNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 nav-links gap-lg-2">
                    <li class="nav-item"><a class="nav-link" id="homeLink" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" id="servicesLink" href="#">Services</a></li>
                    <li class="nav-item"><a class="nav-link" id="userLink" href="#">User</a></li>
                    <li class="nav-item"><a class="nav-link" id="addServiceLink" href="#">Add Service</a></li>
                    <li class="nav-item"><a class="nav-link" id="workingHoursLink" href="#">Hours</a></li>
                    <li class="nav-item"><a class="nav-link" id="loginLink" href="#">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container py-4 py-lg-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 text-center salonic-main salonic-page-enter auth-page auth-page-card">
                <h1 class="h3 mb-3">Login required</h1>
                <p class="subtitle mb-4">You need to sign in as an artist to open this area.</p>
                <a id="unlogged-artist-login-btn" class="btn btn-primary btn-lg px-5" href="/Salon/Artist/Login">Go to artist login</a>
                <p class="auth-switch auth-switch-spaced mt-4 mb-0">Booking as a guest? <a id="unlogged-artist-guest-link" href="/Salon/UnloggedGuest">Guest login page</a></p>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/api.js"></script>
    <script src="/common.js"></script>
    <script src="/unloggedArtistPage.js"></script>
    <script src="/artistNavbar.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <script src="/buttonFeedback.js"></script>
    <script>
        (function () {
            function setUnloggedArtistHrefs() {
                var p = new URLSearchParams(window.location.search);
                var sid = p.get('salonId') || p.get('salonid');
                var q = sid ? '?salonId=' + encodeURIComponent(sid) : '';
                var loginBtn = document.getElementById('unlogged-artist-login-btn');
                if (loginBtn) loginBtn.href = '/Salon/Artist/Login' + q;
                var guest = document.getElementById('unlogged-artist-guest-link');
                if (guest) guest.href = '/Salon/UnloggedGuest' + q;
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setUnloggedArtistHrefs);
            else setUnloggedArtistHrefs();
        })();
    </script>
</body>
</html>
