<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoglalóPlusz — Nyitvatartásom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <nav>
        <a id="logoLink" href="#" class="logo">FoglalóPlusz</a>
        <ul class="nav-links">
            <li><a id="homeLink" href="#">Kezdőlap</a></li>
            <li><a id="servicesLink" href="#">Szolgáltatások</a></li>
            <li><a id="userLink" href="#">Profil</a></li>
            <li><a id="addServiceLink" href="#">Új szolgáltatás</a></li>
            <li><a id="workingHoursLink" href="#">Nyitvatartás</a></li>
            <li><a id="loginLink" href="#">Bejelentkezés</a></li>
        </ul>
    </nav>
    <main class="artist-hours-page">
        <h1>Nyitvatartásom</h1>
        <p class="subtitle">A jelenlegi beosztásod és frissítés alább.</p>
        <p class="artist-hours-switch"><a id="artist-hours-to-set" href="#">Nyitvatartás megadása dátum szerint</a></p>

        <section class="artist-hours-section" aria-labelledby="current-hours-heading">
            <h2 id="current-hours-heading" class="section-title">Aktuális nyitvatartás</h2>
            <ul id="artist-hours-list" class="artist-hours-list">
            </ul>
        </section>

        <section class="artist-hours-section" aria-labelledby="modify-hours-heading">
            <h2 id="modify-hours-heading" class="section-title">Módosítás</h2>
            <form class="adservice-form">
                <label for="hours-day">Nap</label>
                <select id="hours-day" name="hours-day">
                    <option>Hétfő</option>
                    <option>Kedd</option>
                    <option>Szerda</option>
                    <option>Csütörtök</option>
                    <option>Péntek</option>
                    <option>Szombat</option>
                    <option>Vasárnap</option>
                </select>

                <div class="working-hours-time-row">
                    <div class="working-hours-time-field">
                        <label for="hours-start">Kezdés</label>
                        <input id="hours-start" type="time" name="hours-start">
                    </div>
                    <div class="working-hours-time-field">
                        <label for="hours-end">Zárás</label>
                        <input id="hours-end" type="time" name="hours-end">
                    </div>
                </div>

                <button type="button">Változtatások mentése</button>
            </form>
        </section>
    </main>
    <script src="/script.js"></script>
    <script src="/artistNavbar.js"></script>
    <script src="/api.js"></script>
</body>
</html>
