<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salonic — User</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <a href="HomePage.html" class="logo">Salonic</a>
        <ul class="nav-links">
            <li><a href="HomePage.html">Home</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="artists.html">Artists</a></li>
            <li><a href="#">Book</a></li>
            <li><a href="user.html">User</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>
    <main class="user-page">
        <h1>My account</h1>
        <p class="subtitle">Your profile and bookings.</p>
        <div id="user-profile" class="user-profile">
            <div class="user-info">
                <div class="info-row"><span class="info-label">Name</span><span class="info-value" id="user-name">Alex Morgan</span></div>
                <div class="info-row"><span class="info-label">Email</span><span class="info-value" id="user-email">alex.morgan@example.com</span></div>
                <div class="info-row"><span class="info-label">Role</span><span class="info-value" id="user-role">Guest</span></div>
            </div>
        </div>
        <h2 class="section-title">Upcoming appointments</h2>
        <div id="user-appointments" class="services-list">
            <div class="service-card">
                <div class="name">Haircut & finish</div>
                <div class="desc">Mon 18 Mar, 10:00 — with Maya Chen</div>
            </div>
            <div class="service-card">
                <div class="name">Manicure</div>
                <div class="desc">Thu 21 Mar, 14:30 — with Elena Rossi</div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
