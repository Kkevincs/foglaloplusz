<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Nails - Register</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <ul id="nav-bar" class="nav-menu"></ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <main>
        <section class="page-header">
            <div class="container">
                <h1>Create Account</h1>
                <p>Join Luxury Nails and start booking appointments</p>
            </div>
        </section>

        <section class="scheduler-content">
            <div class="container">
                <div class="booking-form-container">
                    <form class="booking-form" id="registerForm">
                        <div class="form-section">
                            <h2>Account Type</h2>
                            <div class="form-group">
                                <label>I am registering as: *</label>
                                <div style="display: flex; gap: 2rem; margin-top: 0.5rem;">
                                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                        <input type="radio" name="accountType" value="user" checked required>
                                        <span>Guest/Client</span>
                                    </label>
                                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                        <input type="radio" name="accountType" value="worker" required>
                                        <span>Worker/Staff</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="form-section">
                            <h2>Account Information</h2>
                            <div class="form-group">
                                <label for="name">Full Name *</label>
                                <input type="text" id="name" name="name" required placeholder="John Doe">
                            </div>
                            <div class="form-group">
                                <label for="email">Email *</label>
                                <input type="email" id="email" name="email" required placeholder="your.email@example.com">
                            </div>
                            <div class="form-group">
                                <label for="password">Password *</label>
                                <input type="password" id="password" name="password" required placeholder="Create a password">
                            </div>
                            <div class="form-group">
                                <label for="confirmPassword">Confirm Password *</label>
                                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your password">
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn-primary">Create Account</button>
                            <a href="login.html" class="btn-secondary" style="text-decoration: none; display: inline-block;">Already have an account? Login</a>
                        </div>
                        <p id="registerMessage" class="form-note" style="margin-top: 1rem;"></p>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Luxury Nails. All rights reserved.</p>
        </div>
    </footer>
    <script src="script.js"></script>
    <script src="api.js"></script>
    <script src="register.js"></script>
</body>
</html>
