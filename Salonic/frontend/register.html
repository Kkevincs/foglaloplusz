<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Nails - Register</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <h1>💅 Luxury Nails</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="addService.html">Add Service</a></li>
                <li><a href="profiles.html">Our Team</a></li>
                <li><a href="scheduler.html">Book Appointment</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html" class="active">Register</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <main>
        <section class="page-header">
            <div class="container">
                <h1>Create Account</h1>
                <p>Join Luxury Nails and start booking appointments</p>
            </div>
        </section>

        <section class="scheduler-content">
            <div class="container">
                <div class="booking-form-container">
                    <form class="booking-form" id="registerForm">
                        <div class="form-section">
                            <h2>Account Information</h2>
                            <div class="form-group">
                                <label for="name">Full Name *</label>
                                <input type="text" id="name" name="name" required placeholder="John Doe">
                            </div>
                            <div class="form-group">
                                <label for="email">Email *</label>
                                <input type="email" id="email" name="email" required placeholder="your.email@example.com">
                            </div>
                            <div class="form-group">
                                <label for="password">Password *</label>
                                <input type="password" id="password" name="password" required placeholder="Create a password">
                            </div>
                            <div class="form-group">
                                <label for="confirmPassword">Confirm Password *</label>
                                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your password">
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-primary">Create Account</button>
                            <a href="login.html" class="btn-secondary" style="text-decoration: none; display: inline-block;">Already have an account? Login</a>
                        </div>

                        <p id="registerMessage" class="form-note" style="margin-top: 1rem;"></p>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Luxury Nails. All rights reserved.</p>
        </div>
    </footer>

    <script src="api.js"></script>
    <script src="script.js"></script>
    <script src="register.js"></script>
</body>
</html>
