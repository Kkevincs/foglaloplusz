<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salonic — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <a href="HomePage.html" class="logo"><img src="img/Salonic_Logo.png" alt="Salonic" /></a>
        <ul class="nav-links">
            <li><a href="HomePage.html">Home</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="artists.html">Artists</a></li>
            <li><a href="#">Book</a></li>
            <li><a href="user.html">User</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>
    <main class="auth-page">
        <h1>Login</h1>
        <form id="login-form" class="auth-form">
            <div class="role-toggle">
                <label><input type="radio" name="role" value="guest" checked> Guest</label>
                <label><input type="radio" name="role" value="artist"> Artist</label>
                <label><input type="radio" name="role" value="owner"> Owner</label>
                <label><input type="radio" name="role" value="admin"> Admin</label>
            </div>
            <input id="Name" type="text" name="emailOrUsername" placeholder="Email or username" required>
            <input id="Password" type="password" name="password" placeholder="Password" required>
            <button type="submit">Log in</button>
        </form>
        <p class="auth-switch">Don't have an account? <a href="register.html">Register</a></p>
    </main>
    <script src="script.js"></script>
    <script src="api.js"></script>
</body>
</html>
