<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Nails - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <ul id="nav-bar" class="nav-menu"></ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <main>
        <section class="page-header">
            <div class="container">
                <h1>Login</h1>
                <p>Sign in to your account</p>
            </div>
        </section>

        <section class="scheduler-content">
            <div class="container">
                <div class="booking-form-container">
                    <form class="booking-form" id="loginForm">
                        <div class="form-section">
                            <h2>Login Information</h2>
                            <div class="form-group">
                                <label for="email">Email *</label>
                                <input type="email" id="email" name="email" required placeholder="your.email@example.com">
                            </div>
                            <div class="form-group">
                                <label for="password">Password *</label>
                                <input type="password" id="password" name="password" required placeholder="Enter your password">
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn-primary">Login</button>
                            <a href="register.html" class="btn-secondary" style="text-decoration: none; display: inline-block;">Create Account</a>
                        </div>
                        <p id="loginMessage" class="form-note" style="margin-top: 1rem;"></p>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Luxury Nails. All rights reserved.</p>
        </div>
    </footer>
    <script src="script.js"></script>
    <script src="api.js"></script>
    <script src="login.js"></script>
</body>
</html>
